name: P1 Wikimedia portrait pilot
on:
  push:
    branches: [hq-p1-portrait-recovery]
    paths: ['scripts/p1-auto-portraits.py', '.github/workflows/p1-auto-portraits.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: p1-portrait-recovery
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/hq-p1-portrait-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: hq-p1-portrait-recovery
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: .p1-cache
          key: p1-api-${{ github.run_id }}
          restore-keys: p1-api-
      - run: python -m pip install requests Pillow
      - run: python -m py_compile scripts/p1-auto-portraits.py
      - name: Recover initial 20-person batch
        run: python scripts/p1-auto-portraits.py --limit 20
      - name: Commit downloaded candidates and evidence (not active in game)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/p1-portraits.json docs/P1-AUTO-R2-REPORT.json
          if test -d assets/p1-portraits; then git add assets/p1-portraits; fi
          git diff --cached --quiet && exit 0
          git commit -m "P1 R2: record Wikimedia pilot candidates and provenance"
          git pull --rebase origin hq-p1-portrait-recovery
          git push origin HEAD:refs/heads/hq-p1-portrait-recovery
      - name: Expand by up to 100 new people after pilot is safely committed
        run: |
          python - <<'PY'
          import json, pathlib, subprocess
          rows=json.load(open('data/p1-portraits.json'))
          report=json.load(open('docs/P1-AUTO-R2-REPORT.json'))
          if len(rows)<10 or any('rate limit or maxlag' in x.get('reason','') or 'Retry-After' in x.get('reason','') for x in report['results'].values() if x.get('status')=='temporary_error'):
              print('Expansion held: insufficient pilot downloads or server-requested pause')
          else:
              subprocess.run(['python','scripts/p1-auto-portraits.py','--expand','--limit','100'],check=True)
          PY
      - name: Commit expansion candidates and audit trail
        run: |
          git add data/p1-portraits.json docs/P1-AUTO-R2-REPORT.json
          if test -d assets/p1-portraits; then git add assets/p1-portraits; fi
          git diff --cached --quiet && exit 0
          git commit -m "P1 R4: expand portrait acquisition queue with priority roster"
          git pull --rebase origin hq-p1-portrait-recovery
          git push origin HEAD:refs/heads/hq-p1-portrait-recovery
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-pilot-results
          path: |
            data/p1-portraits.json
            docs/P1-AUTO-R2-REPORT.json
            assets/p1-portraits/
          if-no-files-found: warn
