name: P1 R4 validate and connect collected portraits
on:
  push:
    branches: [hq-p1-portrait-recovery]
    paths: ['scripts/p1-connect-portraits.py','tests/browser-p1-connected.mjs','tests/p1-connected.test.js','.github/workflows/p1-connect.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: p1-r4-connect
  cancel-in-progress: false
jobs:
  validate-connect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: hq-p1-portrait-recovery
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: python -m pip install requests Pillow
      - name: Offline validation of all collected images and build connected index
        run: python scripts/p1-connect-portraits.py
      - run: npm test
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Verify real connected game cards and profiles
        run: |
          python -m http.server 8000 > server.log 2>&1 &
          node tests/browser-p1-connected.mjs
      - name: Commit generated index and validation report after tests
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/p1-connected.json docs/P1-R4-ACTIVATION.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "P1 R4: connect validated local portrait records"
          git pull --rebase origin hq-p1-portrait-recovery
          git push origin HEAD:refs/heads/hq-p1-portrait-recovery
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-r4-activation
          path: |
            data/p1-connected.json
            docs/P1-R4-ACTIVATION.json
            server.log
          if-no-files-found: warn
