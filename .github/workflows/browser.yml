name: Browser and mobile smoke tests
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm test
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: |
          python -m http.server 8000 > server.log 2>&1 &
          node tests/browser.mjs
          node tests/browser-v7.mjs
          node tests/browser-v176.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: |
            browser-*.png
            v7-*.png
            v176-*.png
            server.log
