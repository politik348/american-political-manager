name: Browser and mobile smoke tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm test
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: |
          python -m http.server 8000 > server.log 2>&1 &
          set +e
          status=0
          for script in tests/browser.mjs tests/browser-v7.mjs tests/browser-v176.mjs tests/browser-i1.mjs tests/browser-i1-rc.mjs tests/browser-i1-r4.mjs tests/browser-i1-r7-notebook.mjs tests/browser-v18.mjs; do
            echo "Running $script"
            node "$script" || status=1
          done
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: |
            browser-*.png
            v7-*.png
            v176-*.png
            server.log
